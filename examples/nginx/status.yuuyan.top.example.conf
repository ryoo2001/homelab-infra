server {
    listen 80;
    server_name status.yuuyan.top;

    # Redirect the root path to the public status page.
    location = / {
        return 302 /status/home;
    }

    # Public read-only status page.
    location ^~ /status/ {
        proxy_pass http://uptime-kuma:3001;
        include /etc/nginx/conf.d/common-proxy-headers.conf;
    }

    # Block the Uptime Kuma dashboard from the public entry.
    location / {
        return 403;
    }
}
