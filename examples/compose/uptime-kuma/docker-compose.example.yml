services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    networks:
      # Join proxy only when reverse-nginx needs to expose a read-only status page.
      - proxy
    volumes:
      - uptime-kuma-data:/app/data

volumes:
  uptime-kuma-data:

networks:
  proxy:
    external: true
